<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P.H.A.N.T.O.M. // ACCENT HUD</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 15px; background: #010409; color: #8b949e;
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }

        .hud-container {
            width: 100%; max-width: 500px; background: #0d1117; border: 1px solid #30363d;
            padding: 20px; border-radius: 8px; box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
            display: flex; flex-direction: column; align-items: center; gap: 20px;
        }

        .header {
            font-size: 12px; letter-spacing: 3px; color: #8b949e; text-transform: uppercase;
        }

        /* Counter-rotating core with Neon White Accents */
        .core-container {
            position: relative; width: 180px; height: 180px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
        .ring-outer {
            position: absolute; width: 100%; height: 100%;
            border: 2px dashed rgba(255, 255, 255, 0.3); border-radius: 50%;
            animation: spinClockwise 12s linear infinite;
        }
        .ring-inner {
            position: absolute; width: 130px; height: 130px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-top: 2px solid transparent; border-bottom: 2px solid transparent;
            border-radius: 50%;
            animation: spinCounter 8s linear infinite;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        }
        .core-center {
            position: absolute; width: 85px; height: 85px;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, #0d1117 85%);
            border: 1px solid #ffffff; border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; font-weight: bold; font-size: 9px; letter-spacing: 1px; color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            animation: pulseCore 3s ease-in-out infinite alternate;
        }

        @keyframes spinClockwise { 100% { transform: rotate(360deg); } }
        @keyframes spinCounter { 100% { transform: rotate(-360deg); } }
        @keyframes pulseCore { 0% { transform: scale(0.96); opacity: 0.85; } 100% { transform: scale(1.04); opacity: 1; } }

        /* Terminal Display */
        .terminal-box {
            width: 100%; height: 120px; background: #010409; border: 1px solid #30363d;
            padding: 10px; border-radius: 4px; overflow-y: auto; font-size: 11px; color: #ffffff;
            line-height: 1.4; text-align: left;
        }

        /* Input Controls */
        .input-row {
            display: flex; width: 100%; gap: 8px;
        }
        input {
            flex: 1; background: #161b22; border: 1px solid #30363d; color: #fff;
            padding: 10px; font-family: monospace; font-size: 12px; border-radius: 4px; outline: none;
        }
        input:focus { border-color: rgba(255, 255, 255, 0.6); }
        button {
            background: #ffffff; color: #010409; border: none; padding: 10px 15px;
            font-weight: bold; font-family: monospace; border-radius: 4px; cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="hud-container">
        <div class="header">P.H.A.N.T.O.M. // ACCENT MODE</div>

        <div class="core-container" onclick="triggerVoiceInput()" title="Tap to talk">
            <div class="ring-outer"></div>
            <div class="ring-inner"></div>
            <div class="core-center" id="core-label">P.H.A.<br>N.T.O.<br>M.</div>
        </div>

        <div id="terminal" class="terminal-box">
            [PHANTOM]: Accent matrix synchronized. Standing by, Mr. Singh.
        </div>

        <div class="input-row">
            <input type="text" id="userInput" placeholder="Type a command..." onkeydown="if(event.key==='Enter') sendToBrain()">
            <button onclick="sendToBrain()">TRANSMIT</button>
        </div>
    </div>

    <script>
        function logMessage(sender, text) {
            const term = document.getElementById('terminal');
            term.innerHTML += `<br>[${sender}]: ${text}`;
            term.scrollTop = term.scrollHeight;
        }

        function speakResponse(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.pitch = 0.85;
            utterance.rate = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const voice = voices.find(v => v.lang === 'en-GB' && v.name.includes('British')) || voices[0];
            if (voice) utterance.voice = voice;
            window.speechSynthesis.speak(utterance);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = SpeechRecognition ? new SpeechRecognition() : null;
        if (recognition) {
            recognition.lang = 'en-GB';
            recognition.onresult = (event) => {
                const spokenText = event.results[0][0].transcript;
                document.getElementById('userInput').value = spokenText;
                sendToBrain();
            };
        }

        function triggerVoiceInput() {
            if (!recognition) {
                logMessage("SYSTEM", "Microphone input unavailable. Type your directive below.");
                return;
            }
            document.getElementById('core-label').innerHTML = "LISTENING";
            recognition.start();
        }

        async function sendToBrain() {
            const inputField = document.getElementById('userInput');
            const query = inputField.value.trim();
            if (!query) return;

            logMessage("MR. SINGH", query);
            inputField.value = "";
            document.getElementById('core-label').innerHTML = "THINKING";

            setTimeout(() => {
                let reply = `Directive executed successfully, Mr. Singh. All accent vectors locked.`;
                logMessage("PHANTOM", reply);
                speakResponse(reply);
                document.getElementById('core-label').innerHTML = "P.H.A.<br>N.T.O.<br>M.";
            }, 600);
        }
    </script>
</body>
</html>
